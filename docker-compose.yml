version: "3"

services:
  redmine:
    build:
      context: .
      dockerfile: Local.Dockerfile
    image: redmine-local
    ports:
      - "3000:3000"
    # environment:
    #   - RAILS_ENV=production
    volumes:
      - redmine-data:/app/redmine/files
    # command: ["bundle", "exec", "rails", "server", "-b", "0.0.0.0"]

volumes:
  redmine-data:
    name: redmine-data
